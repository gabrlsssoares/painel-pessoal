<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eceee6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101713" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Painel Pessoal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
/* Layout: menu lateral fixo + coluna de conteúdo; no celular o menu vira uma gaveta.
   Cor: verde-floresta profundo sobre fundo verde-acinzentado claro, ladrilhos em tons pastel.
   Tipo: Newsreader (títulos) + Figtree (texto e dados). */
:root{
  color-scheme:light;
  --bg:#eceee6; --surface:#f7f8f3; --ink:#1b2a23; --muted:#5f6f66; --line:#d7dcd0;
  --accent:#1d3a2d; --accent-ink:#f2f6ef; --accent2:#3f7a5a;
  --t-sage:#d3deb9; --t-lilac:#e3d4e8; --t-rose:#f0d3d8; --t-plum:#d8c6e0; --t-mist:#cfdcd2;
  --good:#2b7048; --warn:#8f600f; --bad:#a03a3d; --focus:#2f63a0;
  --font-display:"Newsreader",Georgia,"Times New Roman",serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101713; --surface:#17211b; --ink:#e6eee8; --muted:#97a79d; --line:#27342b;
    --accent:#2a5640; --accent-ink:#eef5ee; --accent2:#86c9a0;
    --t-sage:#34402a; --t-lilac:#3b3144; --t-rose:#47312f; --t-plum:#3a2f45; --t-mist:#2b3a31;
    --good:#7fcf9e; --warn:#e0b25a; --bad:#ee9494; --focus:#8bb8ee; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101713; --surface:#17211b; --ink:#e6eee8; --muted:#97a79d; --line:#27342b;
  --accent:#2a5640; --accent-ink:#eef5ee; --accent2:#86c9a0;
  --t-sage:#34402a; --t-lilac:#3b3144; --t-rose:#47312f; --t-plum:#3a2f45; --t-mist:#2b3a31;
  --good:#7fcf9e; --warn:#e0b25a; --bad:#ee9494; --focus:#8bb8ee; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3{font-family:var(--font-display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:32px;max-width:1160px;margin:0 auto}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100vh;overflow-y:auto;padding:22px 0 28px}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--font-display);font-size:24px;padding:0 10px 14px}
.brand small{font-family:var(--font-body);font-size:12px;color:var(--muted)}
.nav-label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:16px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface)}
.nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav .sub{margin-left:22px;border-left:1px solid var(--line);padding-left:8px}
.nav .grp{display:flex;align-items:center;gap:10px;padding:7px 10px;font-weight:500}
.nav .grp.small{font-size:13px;color:var(--muted);padding:4px 10px}
.tile{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;color:var(--ink)}
.tile svg,.ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tone-sage{background:var(--t-sage)}.tone-lilac{background:var(--t-lilac)}.tone-rose{background:var(--t-rose)}
.tone-plum{background:var(--t-plum)}.tone-mist{background:var(--t-mist)}
.nav a[aria-current="page"] .tile{background:rgba(255,255,255,.16);color:var(--accent-ink)}
.main{min-width:0;padding-bottom:40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 0 10px}
.top .spacer{flex:1}
.crumb{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;position:relative;flex:none}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600;display:grid;place-items:center}
.menubtn{display:none}
.scrim{display:none}
.page{display:flex;flex-direction:column;gap:22px}
.greet{font-size:clamp(28px,5vw,38px)}
.sub-line{color:var(--muted);font-size:14px;margin-top:4px}
h2.sec{font-size:20px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.dark{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-head h3{font-size:18px}
.link{background:none;border:0;padding:0;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.dark .link{color:var(--accent-ink);opacity:.85}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.stats.quad{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:560px){.stats.quad{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--font-display);font-weight:500;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row>input[type=text],.row>input:not([type]){flex:1 1 180px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
input[type=number]{width:110px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.small{padding:5px 10px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.check{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--muted);background:var(--bg);cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
.check[aria-pressed="true"]{background:var(--accent2);border-color:var(--accent2);color:var(--bg)}
.check svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.done{text-decoration:line-through;color:var(--muted)}
.days{display:flex;gap:5px}
.dotbtn{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;padding:0}
.dotbtn[aria-pressed="true"]{background:var(--accent2);border-color:var(--accent2);color:var(--bg)}
.dotbtn.today{border-color:var(--ink)}
.bar{height:8px;border-radius:4px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent2)}
.bar.over i{background:var(--bad)}
.cat{display:grid;grid-template-columns:110px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.cat .val{text-align:right;font-variant-numeric:tabular-nums}
.spark{width:100%;height:auto;display:block}
.spark .grid{stroke:var(--line);stroke-width:1}
.spark .tick{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.spark .area{fill:var(--t-sage);opacity:.75}
.spark .line{stroke:var(--accent2);stroke-width:2.2;stroke-linejoin:round}
.spark .dot{fill:var(--accent2)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.note{border:1px dashed var(--muted);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink);background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.mute{color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.vaga{display:flex;flex-direction:column;gap:10px}
.vaga h3{font-size:20px;line-height:1.2}
.vaga .meta{font-size:14px;color:var(--muted)}
.vaga .why{font-size:14px}
.vaga .obs{font-size:13px;color:var(--warn)}
.vaga .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vaga.is-nova{border-color:var(--accent2)}
.vaga.is-descartada{opacity:.65}
a.btn{text-decoration:none;display:inline-block}
details.card summary{cursor:pointer;font-family:var(--font-display);font-size:18px}
details.card[open] summary{margin-bottom:10px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;max-width:min(92vw,420px)}
@media (max-width:859px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .menubtn{display:grid}
  .side{position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);max-height:none;background:var(--surface);z-index:70;
    padding:calc(18px + env(safe-area-inset-top,0px)) 14px 24px max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);
    transform:translateX(-105%);transition:transform .2s ease;visibility:hidden}
  .side.open{transform:none;visibility:visible}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:65}
  .cat{grid-template-columns:90px minmax(0,1fr) 84px}
  .kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
[hidden]{display:none!important}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.lockcard{width:min(420px,100%);display:flex;flex-direction:column;gap:14px}
.lockcard h1{font-size:34px}
.lockcard input{width:100%;font-size:16px;letter-spacing:.04em}
.lockerr{min-height:1.4em;color:var(--bad);font-size:14px}

html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg)}
body{min-height:100vh}
</style>
</head>
<body>

<div class="shell">
  <aside class="side" id="side" aria-label="Menu"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <div class="top">
      <button class="iconbtn menubtn" id="menubtn" aria-label="Abrir menu"></button>
      <div class="crumb" id="crumb"></div>
      <div class="spacer"></div>
      <button class="iconbtn" id="bell" aria-label="Novidades do Radar de Vagas"></button>
      <button class="iconbtn" id="themebtn" aria-label="Alternar modo escuro"></button>
    </div>
    <main id="view"></main>
  </div>
</div>
<div id="lock" hidden>
  <form class="lockcard" id="lockform" autocomplete="off">
    <h1>Painel</h1>
    <p id="lockmsg">Cole a chave de acesso para abrir. Você faz isso uma vez neste aparelho.</p>
    <label for="lockkey" class="muted">Chave de acesso</label>
    <input id="lockkey" type="text" inputmode="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX">
    <button class="btn primary" id="lockbtn" type="submit">Desbloquear</button>
    <p class="lockerr" id="lockerr" role="alert"></p>
  </form>
</div>

<div id="toastbox" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- utilidades ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
function h(tag,attrs){
  var e=document.createElement(tag),a=attrs||{};
  for(var k in a){var v=a[k]; if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);}
  for(var i=2;i<arguments.length;i++){append(e,arguments[i])}
  return e;
}
function append(e,c){
  if(c==null||c===false)return;
  if(Array.isArray(c)){c.forEach(function(x){append(e,x)});return}
  e.append(c.nodeType?c:document.createTextNode(String(c)));
}
var ICON={
  home:'<path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/>',
  check:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.5l2.5 2.5 4.5-5.5"/>',
  heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 017-2.4A4 4 0 0119 10c0 5.6-7 10-7 10z"/>',
  wallet:'<path d="M4 7h14a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2V7z"/><path d="M4 7l11-3v3"/><circle cx="16" cy="13.5" r="1.2"/>',
  briefcase:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2"/><path d="M3 13h18"/>',
  radar:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 12l5-5"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  bell:'<path d="M6 16V11a6 6 0 0112 0v5l1.5 2h-15L6 16z"/><path d="M10 20a2 2 0 004 0"/>',
  moon:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>',
  tick:'<path d="M5 12.5l4.5 4.5L19 7.5"/>'
};
function ic(n){var s=document.createElement('span');s.className='ic';s.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[n]+'</svg>';return s.firstChild}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x}
var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var DIAS=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
var BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
function parseValor(s){
  s=String(s||'').trim(); if(!s)return NaN;
  if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');
  return Number(s);
}
function fmtData(s){var p=String(s||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:String(s||'')}
function fmtQuando(s){
  var d=new Date(s); if(isNaN(d))return '';
  return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function safeLink(u){return typeof u==='string'&&/^https:\/\/[^\s]+$/.test(u)}
var toastTimer=null;
function toast(msg){
  var box=$('#toastbox'); box.replaceChildren(h('div',{class:'toast',role:'status'},msg));
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){box.replaceChildren()},3600);
}

/* ---------- estado ---------- */
var S={nome:'',db:null,tarefas:[],habitos:[],treinos:[],despesas:[],vagas:[],config:null,metas:null,
  loaded:{},view:'inicio',filtro:'ativas',offline:false,err:null,dirty:false};
var VIEWS=['inicio','hoje','saude','financas','radar'];
try{var hh=(location.hash||'').replace('#',''); if(VIEWS.indexOf(hh)>=0)S.view=hh}catch(e){}

async function W(fn){
  if(!S.db){toast('Entre na sua conta para salvar.');return false}
  try{await fn();return true}
  catch(e){toast(e&&e.code==='invalid_argument'?'Você não tem permissão para salvar neste painel.':'Não foi possível salvar. Tente de novo.');return false}
}
function salvarMetas(patch){
  var base=Object.assign({},S.metas||{});delete base.id;
  return S.db.doc('metas/painel').set(Object.assign(base,patch));
}
function confirmBtn(label,run){
  var b=h('button',{class:'link',type:'button'},label),t=null;
  b.addEventListener('click',function(){
    if(b.dataset.armed==='1'){clearTimeout(t);run();return}
    b.dataset.armed='1';b.textContent='Confirmar';t=setTimeout(function(){b.dataset.armed='0';b.textContent=label},3000);
  });
  return b;
}

/* ---------- cálculos ---------- */
function habitPct(date){
  if(!S.habitos.length)return 0;
  var n=0;S.habitos.forEach(function(x){if(x.dias&&x.dias[date]===true)n++});
  return Math.round(n*100/S.habitos.length);
}
function habitStats(){
  if(!S.habitos.length)return null;
  var hoje=new Date(),i,soma=0,serie=[];
  for(i=13;i>=0;i--){var d=addDays(hoje,-i);serie.push({label:pad(d.getDate())+'/'+pad(d.getMonth()+1),v:habitPct(iso(d))})}
  for(i=0;i<7;i++)soma+=habitPct(iso(addDays(hoje,-i)));
  var dm=hoje.getDate(),sm=0;
  for(i=0;i<dm;i++)sm+=habitPct(iso(addDays(hoje,-i)));
  return {hoje:habitPct(iso(hoje)),sete:Math.round(soma/7),mes:Math.round(sm/dm),n:S.habitos.length,serie:serie};
}
function mesAtual(){return iso(new Date()).slice(0,7)}
function treinosMes(){return S.treinos.filter(function(t){return String(t.data||'').slice(0,7)===mesAtual()})}
function despesasMes(){return S.despesas.filter(function(t){return String(t.data||'').slice(0,7)===mesAtual()})}
function novas(){return S.vagas.filter(function(v){return v.status==='nova'}).length}

function spark(serie){
  var W_=640,H=130,L=44,R=14,T=10,B=24,n=serie.length;
  function x(i){return L+i*(W_-L-R)/(n-1)}
  function y(v){return T+(1-v/100)*(H-T-B)}
  var pts=serie.map(function(p,i){return x(i).toFixed(1)+','+y(p.v).toFixed(1)});
  var grid=[0,50,100].map(function(g){
    return '<line class="grid" x1="'+L+'" x2="'+(W_-R)+'" y1="'+y(g)+'" y2="'+y(g)+'"/><text class="tick" x="'+(L-8)+'" y="'+(y(g)+4)+'" text-anchor="end">'+g+'%</text>';
  }).join('');
  var area='M'+x(0).toFixed(1)+','+y(0)+' L'+pts.join(' L')+' L'+x(n-1).toFixed(1)+','+y(0)+' Z';
  var xl=[0,n-1].map(function(i){return '<text class="tick" x="'+x(i)+'" y="'+(H-6)+'" text-anchor="'+(i?'end':'start')+'">'+serie[i].label+'</text>'}).join('');
  var wrap=document.createElement('div');
  wrap.innerHTML='<svg class="spark" viewBox="0 0 '+W_+' '+H+'" role="img" aria-label="Percentual de hábitos cumpridos nos últimos 14 dias">'+grid+
    '<path class="area" d="'+area+'"/><polyline class="line" fill="none" points="'+pts.join(' ')+'"/>'+
    '<circle class="dot" cx="'+x(n-1).toFixed(1)+'" cy="'+y(serie[n-1].v).toFixed(1)+'" r="4.5"/>'+xl+'</svg>';
  return wrap.firstChild;
}

      var tom=f.status==='ok'?'good':f.status==='parcial'?'warn':f.status==='bloqueada'?'bad':'mute';
      var rot=f.status==='ok'?'Funcionou':f.status==='parcial'?'Parcial':f.status==='bloqueada'?'Bloqueada':'Não testada';
      return h('li',null,h('span',{class:'grow'},h('b',null,f.nome),f.nota?h('span',{class:'muted'},' · '+f.nota):null),h('span',{class:'pill '+tom},rot));
    })):h('p',{class:'empty'},'A lista de fontes aparece depois da primeira busca.'));
  var resumo=cfg.resumoBusca?h('details',{class:'card'},h('summary',null,'Resumo da última busca'),h('p',null,cfg.resumoBusca)):null;
  var dedupe=h('p',{class:'muted',style:'font-size:13px'},'Cada vaga é guardada com o código da própria fonte. Se a mesma vaga aparecer de novo numa busca, ela não é repetida.');
  return h('div',{class:'page'},topo,lista,perfil,fontes,resumo,dedupe);
}

/* ---------- navegação e renderização ---------- */
var TITLES={inicio:'Início',hoje:'Hoje & Hábitos',saude:'Saúde & Treinos',financas:'Finanças',radar:'Carreira / Trabalho / Radar de Vagas'};
var VIEWFN={inicio:viewInicio,hoje:viewHoje,saude:viewSaude,financas:viewFinancas,radar:viewRadar};
function navItem(id,label,icon,tone){
  var a=h('a',{href:'#'+id,onclick:function(e){e.preventDefault();go(id)}},h('span',{class:'tile tone-'+tone},ic(icon)),label);
  if(S.view===id)a.setAttribute('aria-current','page');
  return a;
}
function renderSide(){
  var side=$('#side');
  side.replaceChildren(
    h('div',{class:'brand'},'Painel',h('small',null,String(new Date().getFullYear()))),
    h('nav',{class:'nav','aria-label':'Seções'},
      navItem('inicio','Início','home','sage'),
      navItem('hoje','Hoje & Hábitos','check','lilac'),
      h('div',{class:'nav-label'},'Pilares'),
      navItem('saude','Saúde & Treinos','heart','rose'),
      navItem('financas','Finanças','wallet','plum'),
      h('div',{class:'grp'},h('span',{class:'tile tone-mist'},ic('briefcase')),'Carreira'),
      h('div',{class:'sub'},
        h('div',{class:'grp small'},'Trabalho'),
        navItem('radar','Radar de Vagas','radar','sage'))));
}
function renderBell(){
  var b=$('#bell');b.replaceChildren(ic('bell'));
  var n=novas();
  if(n>0)b.appendChild(h('span',{class:'badge'},String(n)));
  b.setAttribute('aria-label',n>0?n+' vagas novas no Radar de Vagas':'Radar de Vagas, sem novidades');
}
function render(){
  S.dirty=false;
  renderSide();renderBell();
  $('#crumb').textContent=TITLES[S.view]||'';
  $('#view').replaceChildren((VIEWFN[S.view]||viewInicio)());
}
var rafPending=false;
function schedule(){
  var a=document.activeElement;
  if(a&&$('#view').contains(a)&&(a.tagName==='INPUT'||a.tagName==='SELECT')&&a.value){S.dirty=true;renderBell();return}
  if(rafPending)return;rafPending=true;
  requestAnimationFrame(function(){rafPending=false;render()});
}
document.addEventListener('focusout',function(){if(S.dirty)setTimeout(function(){if(S.dirty)render()},120)});

function openMenu(){$('#side').classList.add('open');$('#scrim').classList.add('open')}
function closeMenu(){$('#side').classList.remove('open');$('#scrim').classList.remove('open')}
$('#menubtn').appendChild(ic('menu'));
$('#menubtn').addEventListener('click',openMenu);
$('#scrim').addEventListener('click',closeMenu);
$('#bell').addEventListener('click',function(){go('radar')});
$('#themebtn').appendChild(ic('moon'));
$('#themebtn').addEventListener('click',function(){
  var r=document.documentElement,cur=r.getAttribute('data-theme');
  if(!cur)cur=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  var next=cur==='dark'?'light':'dark';r.setAttribute('data-theme',next);
  try{localStorage.setItem('painel-tema',next)}catch(e){}
});
try{var tm=localStorage.getItem('painel-tema');if(tm==='dark'||tm==='light')document.documentElement.setAttribute('data-theme',tm)}catch(e){}

/* ---------- armazenamento neste aparelho (substitui o banco do Claude) ---------- */
var LocalDB=(function(){
  var KEY='painel-pessoal-v1',SEEDED={vagas:1,radar:1};
  var local={},seed={vagas:{},radar:{}},subs=[],api,nome='';
  try{local=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){local={}}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(local))}catch(e){throw {code:'unavailable',message:'storage'}}}
  function clone(x){return JSON.parse(JSON.stringify(x))}
  function isObj(x){return x&&typeof x==='object'&&!Array.isArray(x)}
  function merge(a,b){var o=Object.assign({},a);Object.keys(b).forEach(function(k){var v=b[k];o[k]=(isObj(v)&&isObj(o[k]))?merge(o[k],v):v});return o}
  function notify(){subs.slice().forEach(function(f){try{f()}catch(e){}})}
  function commit(fn){var before=JSON.stringify(local);fn();try{persist()}catch(e){local=JSON.parse(before);throw e}notify()}
  function eff(col,id){
    if(SEEDED[col]){
      var s=seed[col]&&seed[col][id],p=local[col]&&local[col][id];
      if(!s||(p&&p.__deleted))return undefined;
      return p?Object.assign({},s,p):s;
    }
    return local[col]&&local[col][id];
  }
  function ids(col){
    var src=SEEDED[col]?(seed[col]||{}):(local[col]||{});
    return Object.keys(src).filter(function(i){return eff(col,i)!==undefined});
  }
  function docSnap(col,id){var d=eff(col,id);return {id:id,exists:d!==undefined,data:function(){return d===undefined?undefined:clone(d)}}}
  function listen(f){subs.push(f);setTimeout(f,0);return function(){var i=subs.indexOf(f);if(i>=0)subs.splice(i,1)}}
  function docRef(col,id){return {
    onSnapshot:function(next){return listen(function(){next(docSnap(col,id))})},
    set:async function(d){commit(function(){(local[col]=local[col]||{})[id]=clone(d)})},
    update:async function(d){
      var cur=eff(col,id);if(cur===undefined)throw {code:'invalid_argument'};
      commit(function(){
        var box=local[col]=local[col]||{};
        box[id]=SEEDED[col]?Object.assign({},box[id]||{},clone(d)):merge(cur,clone(d));
      });
    },
    delete:async function(){
      commit(function(){
        var box=local[col]=local[col]||{};
        if(SEEDED[col])box[id]=Object.assign({},box[id]||{},{__deleted:true});else delete box[id];
      });
    }
  }}
  api={
    collection:function(col){return {
      onSnapshot:function(next){return listen(function(){next({docs:ids(col).sort().map(function(i){return docSnap(col,i)})})})},
      add:async function(d){
        var id='l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
        commit(function(){(local[col]=local[col]||{})[id]=clone(d)});
        return {id:id};
      },
      doc:function(id){return docRef(col,id)}
    }},
    doc:function(path){var p=path.split('/');return docRef(p[0],p[1])}
  };
  /* --- arquivo de vagas trancado (AES-256-GCM); a chave nunca vai para o site --- */
  function b64(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
  async function deriveKey(str){
    var norm=String(str).toUpperCase().replace(/[^A-Z2-7]/g,'');
    var hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(norm));
    return crypto.subtle.importKey('raw',hash,{name:'AES-GCM'},false,['decrypt']);
  }
  async function loadSeed(keyStr){
    var enc;
    try{
      var ctl=new AbortController(),t=setTimeout(function(){ctl.abort()},8000);
      var r=await fetch('vagas.enc',{cache:'no-cache',signal:ctl.signal});clearTimeout(t);
      if(!r.ok)throw 0;
      enc=await r.json();
    }catch(e){throw {code:'rede'}}
    var plain;
    try{
      var key=await deriveKey(keyStr);
      plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv)},key,b64(enc.ct));
    }catch(e){throw {code:'chave'}}
    var j=JSON.parse(new TextDecoder().decode(plain));
    seed={vagas:{},radar:{}};
    (j.vagas||[]).forEach(function(v){var c=Object.assign({},v);delete c.id;seed.vagas[v.id]=c});
    if(j.config)seed.radar.config=j.config;
    nome=j.nome||'';
  }
  return {
    open:async function(keyStr){await loadSeed(keyStr);return api},
    nome:function(){return nome}
  };
})();

/* ---------- dados ---------- */
function sub(path,key,isDoc){
  var ref=isDoc?S.db.doc(path):S.db.collection(path);
  ref.onSnapshot(function(snap){
    if(isDoc)S[key]=snap.exists?Object.assign({id:snap.id},snap.data()):null;
    else S[key]=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});
    S.loaded[key]=true;schedule();
  },function(e){S.err=(e&&e.code)||'unavailable';S.loaded[key]=true;schedule()});
}
function lockScreen(msg){
  return new Promise(function(resolve){
    var box=$('#lock'),form=$('#lockform'),inp=$('#lockkey'),btn=$('#lockbtn'),err=$('#lockerr');
    box.hidden=false;err.textContent=msg||'';inp.value='';
    form.onsubmit=function(ev){
      ev.preventDefault();
      var k=inp.value.trim();
      if(!k){err.textContent='Cole a chave de acesso.';return}
      btn.disabled=true;err.textContent='Abrindo…';
      LocalDB.open(k).then(function(db){
        try{localStorage.setItem('painel-chave',k)}catch(e){}
        inp.value='';box.hidden=true;btn.disabled=false;err.textContent='';resolve(db);
      },function(e){
        btn.disabled=false;
        err.textContent=(e&&e.code==='rede')?'Não consegui baixar os dados. Confira a internet e tente de novo.':'Chave incorreta. Confira se copiou a chave inteira.';
      });
    };
    setTimeout(function(){try{inp.focus()}catch(e){}},50);
  });
}
async function boot(){
  var key=null,db=null,msg='';
  try{key=localStorage.getItem('painel-chave')}catch(e){}
  if(key){
    try{db=await LocalDB.open(key)}
    catch(e){msg=(e&&e.code==='rede')?'Sem conexão e sem dados salvos neste aparelho. Abra uma vez com internet.':'A chave salva não abre mais os dados. Cole a chave nova.'}
  }
  if(!db)db=await lockScreen(msg);
  S.db=db;S.nome=LocalDB.nome();
  render();

  sub('tarefas','tarefas');sub('habitos','habitos');sub('treinos','treinos');sub('despesas','despesas');
  sub('vagas','vagas');sub('radar/config','config',true);sub('metas/painel','metas',true);
}
boot();
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
})();
</script>
